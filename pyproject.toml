[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-finder"
version = "0.1.0"
description = "Find git-committed passwords, keys, and other secrets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
secret-finder = "secret_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
